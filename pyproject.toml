[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphrag-knowledge-system"
version = "0.1.0"
description = "Enterprise AI-powered Knowledge System combining Knowledge Graphs (Neo4j), Vector Search (Qdrant), and Hybrid GraphRAG for complex multi-hop reasoning."
readme = "README.md"
authors = [{ name = "Tarun", email = "ftarunnnn@github.com" }]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "loguru>=0.7.2",
    "pymupdf>=1.24.0",
    "neo4j>=5.20.0",
    "qdrant-client>=1.9.0",
    "networkx>=3.3",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "streamlit>=1.35.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "black>=24.4.0"
]
